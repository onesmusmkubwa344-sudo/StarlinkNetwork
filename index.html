<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlink Zambia</title>
    <link rel="icon" type="image/png" href="https://www.starlink.com/favicon.ico">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --black: #000000;
            --white: #ffffff;
            --gray-400: #9ca3af;
            --momo-yellow: #FFCC00;
        }

        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(160deg, #0a0a0a 0%, #1a1a1a 50%, #000000 100%);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* Subtle glow behind the text */
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            width: 700px;
            height: 700px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255, 204, 0, 0.14) 0%, transparent 60%);
            animation: pulseGlow 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50%      { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        .message-wrap {
            position: relative;
            z-index: 1;
            max-width: 700px;
            width: 100%;
        }

        .line {
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: -1px;
            word-wrap: break-word;
        }

        .line-1 {
            font-size: clamp(32px, 8vw, 64px);
            color: var(--white);
        }

        .line-2 {
            font-size: clamp(40px, 11vw, 88px);
            margin-top: 20px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .line-3 {
            font-size: clamp(32px, 8vw, 64px);
            margin-top: 24px;
            color: var(--momo-yellow);
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>

    <div class="message-wrap">

        <p class="line line-1">Moboishe Chon Eee Jopiri</p>

        <p class="line line-2">
            <span>😂</span>
            <span>🤣</span>
            <span>😭</span>
        </p>

        <p class="line line-3">Ichuuuss</p>

    </div>

</body>
</html>
